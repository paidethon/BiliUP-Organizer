name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Tests before publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Sync backend dependencies
        run: uv sync --frozen
      - name: Ruff lint (pinned for determinism)
        run: uvx ruff==0.16.9 check .
      - name: Pytest
        run: uv run pytest -q
      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm ci --no-fund --no-audit
          npm run build

  publish:
    name: Build & push image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/paidethon/biliup-organizer
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The GHCR package is private by default; ship the image itself as an
      # artifact so a repo-scoped deployer can docker load it without
      # packages-scope credentials.
      - name: Export image tar for offline deploy
        run: |
          docker pull ghcr.io/paidethon/biliup-organizer:latest
          docker save ghcr.io/paidethon/biliup-organizer:latest | gzip > /tmp/biliup-organizer-latest.tar.gz
          ls -lh /tmp/biliup-organizer-latest.tar.gz
      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-latest
          path: /tmp/biliup-organizer-latest.tar.gz
          retention-days: 14
          if-no-files-found: error
