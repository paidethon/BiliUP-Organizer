# Gitleaks configuration.
# The only allowlisted findings are the PUBLIC Wbi golden test vectors
# (img/sub/mixin keys published in the bilibili-API-collect community
# documentation) appearing in unit tests and the research doc as documented
# constants. They are not credentials. The allowlist requires BOTH an exact
# fingerprint (commit:path:rule:line) AND one of the three public constants,
# so any new real secret is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Public Wbi golden test vectors in tests and research docs (not secrets)"
condition = "and"
regexTarget = "match"
regexes = [
  '''7cd084941338484aae1ad9425b84077c''',
  '''4932caff0ff746eab6f01bf08b70ac45''',
  '''ea1db124af3c7062474693fa704f4ff8''',
]
